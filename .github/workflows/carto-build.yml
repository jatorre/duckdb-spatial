name: CARTO Spatial Extension Build

on:
  push:
    branches:
      - build/carto-spatial-release
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-14
          - os: linux
            arch: amd64
            runner: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ce613c41372b23b1f51333815feb3edd87ef8a8b

      - name: Install Ninja
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            brew install ninja
          else
            sudo apt-get update && sudo apt-get install -y ninja-build
          fi

      - name: Configure
        run: |
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXTENSION_STATIC_BUILD=1 \
            -DDUCKDB_EXTENSION_NAMES="spatial" \
            -DDUCKDB_EXTENSION_SPATIAL_PATH=${{ github.workspace }} \
            -DDUCKDB_EXTENSION_SPATIAL_SHOULD_LINK=1 \
            -S duckdb -B build/release

      - name: Build
        run: ninja -C build/release -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Package extension
        run: |
          mkdir -p dist
          # Find the loadable extension
          find build/release -name "*.duckdb_extension" -exec cp {} dist/ \;
          # Also copy the DuckDB CLI binary
          cp build/release/duckdb dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spatial-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 90
