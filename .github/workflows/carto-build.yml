name: CARTO Spatial Extension Build

on:
  push:
    branches:
      - build/carto-spatial-release
  workflow_dispatch:

jobs:
  # Use the official DuckDB extension CI tools — same as upstream
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      extension_name: spatial
      ci_tools_version: main
      vcpkg_commit: ce613c41372b23b1f51333815feb3edd87ef8a8b
      # Only build the platforms we need
      exclude_archs: 'windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
